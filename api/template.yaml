AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Lowzineh order API (API Gateway HTTP API + Lambda + DynamoDB, Venmo payments)

Parameters:
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "https://aylarba.github.io,http://localhost:5173"
    Description: Websites allowed to call the API (origin only, no path)
  VenmoUsername:
    Type: String
    Description: Your Venmo Business username, without the @
  AdminKey:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: A long random password for the admin page (at least 16 characters)
  OwnerEmail:
    Type: String
    Default: ""
    Description: Optional. Where new-order emails go (needs FromEmail)
  FromEmail:
    Type: String
    Default: ""
    Description: Optional. SES-verified sender. Leave empty to turn emails off
  PriceCents:
    Type: Number
    Default: 2400
  DeliveryFeeCents:
    Type: Number
    Default: 500
  DailyCapacity:
    Type: Number
    Default: 6
  LeadDays:
    Type: Number
    Default: 2
  PaymentWindowHours:
    Type: Number
    Default: 3
  BakeDays:
    Type: String
    Default: "0,1,2,3,4,5,6"
    Description: Days you deliver, 0=Sunday ... 6=Saturday

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    CodeUri: ./
    Environment:
      Variables:
        TABLE_NAME: !Ref OrdersTable
        ALLOWED_ORIGINS: !Join [",", !Ref AllowedOrigins]
        VENMO_USERNAME: !Ref VenmoUsername
        ADMIN_KEY: !Ref AdminKey
        OWNER_EMAIL: !Ref OwnerEmail
        FROM_EMAIL: !Ref FromEmail
        PRICE_CENTS: !Ref PriceCents
        DELIVERY_FEE_CENTS: !Ref DeliveryFeeCents
        DAILY_CAPACITY: !Ref DailyCapacity
        LEAD_DAYS: !Ref LeadDays
        PAYMENT_WINDOW_HOURS: !Ref PaymentWindowHours
        BAKE_DAYS: !Ref BakeDays

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type, x-admin-key]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  OrdersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  AvailabilityFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/availability.handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref OrdersTable }
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /availability, Method: GET }

  OrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/orders.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref OrdersTable }
        - Statement:
            - { Effect: Allow, Action: [ses:SendEmail], Resource: "*" }
      Events:
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /orders, Method: POST }

  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/admin.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref OrdersTable }
        - Statement:
            - { Effect: Allow, Action: [ses:SendEmail], Resource: "*" }
      Events:
        List:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /admin/orders, Method: GET }
        Update:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/admin/orders/{code}/status", Method: POST }

  ExpireFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/expire.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref OrdersTable }
      Events:
        Every15Minutes:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(15 minutes)

Outputs:
  ApiUrl:
    Description: Base URL of the API. Set it as the VITE_API_URL repository variable on GitHub.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  TableName:
    Value: !Ref OrdersTable
